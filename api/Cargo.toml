[package]
name = "url-shortener"
version = "0.1.0"
edition = "2021"
authors = ["DevOps Team"]
description = "Cloud-native URL shortener API"
license = "MIT"

[dependencies]
# Web framework
axum = "0.6"
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "trace", "request-id"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Redis
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }

# ID generation
nanoid = "0.4"

# URL validation - use older version compatible with Rust 1.85
url = "=2.3.1"

# Metrics
prometheus = "0.13"
lazy_static = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.13"
dotenv = "0.15"

# Error handling
thiserror = "1"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }