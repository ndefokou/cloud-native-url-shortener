apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-secret
  namespace: url-shortener
  labels:
    app: url-shortener
type: Opaque
stringData:
  # Redis connection URL (base64 encoded in production)
  # In production, use sealed-secrets or external secrets operator
  REDIS_URL: "redis://redis-service:6379"
  
  # API secret key for signing (generate a secure random key)
  # Generate with: openssl rand -base64 32
  API_SECRET_KEY: "your-secret-key-change-in-production"
  
  # Database credentials (if using managed Redis)
  REDIS_PASSWORD: ""

---
# Secret for GitHub Container Registry
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-credentials
  namespace: url-shortener
  labels:
    app: url-shortener
type: kubernetes.io/dockerconfigjson
data:
  # Base64 encoded Docker config
  # Create with: kubectl create secret docker-registry ghcr-credentials --docker-server=ghcr.io --docker-username=<username> --docker-password=<token> --docker-email=<email> -n url-shortener --dry-run=client -o yaml
  # For now, placeholder - replace in production
  .dockerconfigjson: e30K

---
# Service Account for the API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: url-shortener-api
  namespace: url-shortener
  labels:
    app: url-shortener
automountServiceAccountToken: false

---
# RBAC - Role for the API service account
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: url-shortener-api-role
  namespace: url-shortener
  labels:
    app: url-shortener
rules:
  # Read pods for service discovery
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Read configmaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Read secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: url-shortener-api-rolebinding
  namespace: url-shortener
  labels:
    app: url-shortener
subjects:
  - kind: ServiceAccount
    name: url-shortener-api
    namespace: url-shortener
roleRef:
  kind: Role
  name: url-shortener-api-role
  apiGroup: rbac.authorization.k8s.io