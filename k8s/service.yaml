apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: url-shortener
  labels:
    app: url-shortener
    component: api
spec:
  type: ClusterIP
  selector:
    app: url-shortener
    component: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: url-shortener
  labels:
    app: url-shortener
    component: redis
spec:
  type: ClusterIP
  selector:
    app: url-shortener
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP

---
# Headless service for StatefulSet (if needed for Redis cluster)
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: url-shortener
  labels:
    app: url-shortener
    component: redis
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: url-shortener
    component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP