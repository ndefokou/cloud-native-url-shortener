name: CD — Publish to Docker Hub

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: url-shortener

jobs:
  publish:
    name: Build & Push (Git SHA tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Docker Hub image name
        id: image
        env:
          DOCKERHUB_USERNAME_SECRET: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_USERNAME_VAR: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          user="${DOCKERHUB_USERNAME_SECRET}"
          if [ -z "$user" ]; then
            user="${DOCKERHUB_USERNAME_VAR}"
          fi
          if [ -z "$user" ]; then
            echo "::error::Docker Hub username is not configured."
            echo "::error::Add repository secret DOCKERHUB_USERNAME (and DOCKERHUB_TOKEN), or set repository variable DOCKERHUB_USERNAME."
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add repository secret DOCKERHUB_TOKEN (Docker Hub access token)."
            exit 1
          fi
          echo "user=${user}" >> "$GITHUB_OUTPUT"
          echo "repository=${user}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.image.outputs.user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ github.sha }}
            ${{ steps.image.outputs.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
