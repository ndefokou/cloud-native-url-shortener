name: CD — Publish to Docker Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  IMAGE_NAME: url-shortener

jobs:
  docker:
    name: ${{ github.event_name == 'pull_request' && 'Build image (PR — no push)' || 'Build & Push to Docker Hub' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Hub configuration
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::DOCKERHUB_USERNAME is empty."
            echo "::error::Set the repository secret to your Docker Hub ID (e.g. mbunwevicki100 — see hub.docker.com profile)."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ] && [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_TOKEN is empty."
            exit 1
          fi
          echo "Docker Hub user: ${{ secrets.DOCKERHUB_USERNAME }}"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}
            type=sha,enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: PR build summary
        if: github.event_name == 'pull_request'
        run: |
          echo "### Docker build OK (not pushed to Hub)" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated image build for \`${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Merge to \`main\` to publish \`:<sha>\` and \`:latest\`." >> "$GITHUB_STEP_SUMMARY"
